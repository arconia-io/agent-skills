name: Release

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  VERSION: 0.0.1

permissions:
  contents: read

jobs:
  package:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Set up Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Build devenv shell
        run: devenv test

      - name: Login to Docker
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}

      - name: Build and publish Skills OCI artifacts
        shell: devenv shell bash -- -e {0}
        run: task skills:publish VERSION=${{ env.VERSION }}

      - name: Sign Skills OCI artifacts
        shell: devenv shell bash -- -e {0}
        run: task skills:sign VERSION=${{ env.VERSION }}

      - name: Build and publish Skills Collection OCI artifact
        shell: devenv shell bash -- -e {0}
        run: task collection:publish VERSION=${{ env.VERSION }}

      - name: Sign Skills Collection OCI artifact
        shell: devenv shell bash -- -e {0}
        run: task collection:sign VERSION=${{ env.VERSION }}
